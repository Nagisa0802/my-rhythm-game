<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Beat Master Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: white; overflow: hidden; height: 100vh; margin: 0; font-family: sans-serif; touch-action: none; -webkit-user-select: none; }
        canvas { background: #020617; display: block; width: 100%; height: 100%; }
        .diff-active { border-color: #06b6d4 !important; color: #06b6d4 !important; background: rgba(6, 182, 212, 0.2) !important; }
        .countdown-text { animation: zoomInOut 0.8s ease-in-out infinite; }
        @keyframes zoomInOut {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.5); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }
        .song-card { transition: all 0.2s; border: 1px solid #334155; }
        .song-card:active { transform: scale(0.98); background: #1e293b; }
        .auto-badge { background: #f43f5e; color: white; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-left: 8px; vertical-align: middle; }
    </style>
</head>
<body>

    <div id="game-container" class="relative w-full h-full flex items-center justify-center">
        <!-- 頂部資訊 -->
        <div class="absolute top-12 left-6 z-10 pointer-events-none">
            <div id="score-text" class="text-xl font-mono text-cyan-400 uppercase tracking-wider">SCORE: 000000</div>
            <div id="combo-text" class="text-4xl font-black text-white italic"></div>
            <div id="auto-indicator" class="hidden text-rose-500 font-bold text-sm mt-1 tracking-widest">AUTO PLAY ACTIVE</div>
        </div>

        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer" class="absolute inset-0 pointer-events-none flex flex-col items-center justify-center">
            <div id="judgment-text" class="text-5xl font-black italic transition-all duration-75 mb-20"></div>
            <div id="countdown-layer" class="hidden text-8xl font-black italic text-cyan-400 countdown-text">3</div>

            <!-- 主選單 -->
            <div id="menu" class="pointer-events-auto bg-slate-900/95 p-6 rounded-[2rem] border border-slate-700 shadow-2xl flex flex-col items-center gap-4 text-center mx-4 max-w-md w-full">
                <h1 class="text-3xl font-black text-cyan-400 tracking-tighter italic">BEAT MASTER PRO</h1>
                
                <div class="flex items-center gap-2 mb-2">
                    <input type="checkbox" id="auto-play-toggle" class="w-5 h-5 accent-rose-500 cursor-pointer">
                    <label for="auto-play-toggle" class="text-slate-300 font-bold text-sm cursor-pointer italic uppercase">Enable Auto Play</label>
                </div>

                <div class="w-full space-y-2">
                    <div class="flex gap-2 justify-center">
                        <button id="btn-Easy" onclick="changeDiff('Easy')" class="diff-btn flex-1 py-2 rounded-xl bg-slate-800 border-2 border-transparent font-bold text-sm">簡單</button>
                        <button id="btn-Normal" onclick="changeDiff('Normal')" class="diff-btn flex-1 py-2 rounded-xl bg-slate-800 border-2 border-transparent font-bold diff-active text-sm">一般</button>
                        <button id="btn-Hard" onclick="changeDiff('Hard')" class="diff-btn flex-1 py-2 rounded-xl bg-slate-800 border-2 border-transparent font-bold text-sm">困難</button>
                    </div>
                </div>

                <div class="w-full space-y-2 text-left">
                    <p class="text-slate-500 text-xs font-bold px-2 uppercase">內建歌曲</p>
                    <div class="grid grid-cols-1 gap-2">
                        <button onclick="loadBuiltIn('song1.mp3')" class="song-card w-full p-3 rounded-xl bg-slate-800/50 flex items-center gap-3 hover:border-cyan-500">
                            <div class="w-10 h-10 bg-cyan-900 rounded-lg flex items-center justify-center text-cyan-400 font-black">1</div>
                            <div class="text-left">
                                <div class="font-bold text-sm text-white">電音狂想曲</div>
                                <div class="text-[10px] text-slate-500">Fast Tempo EDM</div>
                            </div>
                        </button>
                    </div>
                </div>

                <div class="w-full border-t border-slate-700 my-1"></div>

                <label for="music-upload" class="w-full bg-cyan-700 hover:bg-cyan-600 px-6 py-3 rounded-xl cursor-pointer font-bold text-sm transition-all shadow-lg text-white">
                    上傳自定義音樂 (MP3)
                </label>
                <input type="file" id="music-upload" class="hidden" accept="audio/*">
            </div>

            <!-- 結算畫面 -->
            <div id="result-screen" class="hidden pointer-events-auto bg-slate-900/98 p-10 rounded-[2rem] border-2 border-cyan-500 flex flex-col items-center gap-4 text-center max-w-sm w-full">
                <h2 class="text-3xl font-bold text-white uppercase tracking-widest">
                    Stage Clear <span id="auto-tag" class="hidden auto-badge">AUTO</span>
                </h2>
                
                <div class="bg-slate-800/50 p-6 rounded-2xl w-full space-y-2 font-mono text-sm">
                    <div class="flex justify-between border-b border-slate-700 pb-1">
                        <span class="text-slate-400">SCORE</span>
                        <span id="final-score" class="text-white font-bold text-lg">0</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-slate-400">MAX COMBO</span>
                        <span id="max-combo" class="text-cyan-400">0</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-slate-400">PERFECT</span>
                        <span id="perfect-count" class="text-yellow-400">0</span>
                    </div>
                </div>

                <div id="rank-text" class="text-8xl font-black text-cyan-400 drop-shadow-lg">S</div>
                <button onclick="location.reload()" class="w-full bg-white text-black py-3 rounded-xl font-bold active:scale-95 transition-transform">BACK TO MENU</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const musicUpload = document.getElementById('music-upload');
        const menuEl = document.getElementById('menu');
        const resultEl = document.getElementById('result-screen');
        const scoreEl = document.getElementById('score-text');
        const comboEl = document.getElementById('combo-text');
        const judgmentEl = document.getElementById('judgment-text');
        const countdownEl = document.getElementById('countdown-layer');
        const autoPlayToggle = document.getElementById('auto-play-toggle');
        const autoIndicator = document.getElementById('auto-indicator');

        let CANVAS_WIDTH, CANVAS_HEIGHT, LANE_WIDTH, JUDGMENT_LINE_Y;
        let difficulty = 'Normal';
        let noteSpeed = 12; // 提升速度感
        let gameActive = false;
        let isCountingDown = false;
        let isAutoPlay = false;
        let score = 0, combo = 0, maxCombo = 0, perfectCount = 0;
        let notes = [];
        let startTime = 0;
        let audioCtx, audioBuffer, audioSource;
        const activeLanes = [false, false, false, false];

        // 精確的時間常數
        const SYNC_OFFSET = 0.05; // 50ms 的音樂延遲補償

        function getTravelTime() {
            return JUDGMENT_LINE_Y / (noteSpeed * 60);
        }

        function changeDiff(d) {
            difficulty = d;
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('diff-active'));
            document.getElementById('btn-' + d).classList.add('diff-active');
            noteSpeed = d === 'Easy' ? 9 : (d === 'Normal' ? 13 : 18);
        }

        function resize() {
            CANVAS_WIDTH = window.innerWidth;
            CANVAS_HEIGHT = window.innerHeight;
            canvas.width = CANVAS_WIDTH;
            canvas.height = CANVAS_HEIGHT;
            LANE_WIDTH = CANVAS_WIDTH / 4;
            JUDGMENT_LINE_Y = CANVAS_HEIGHT * 0.85;
        }
        window.addEventListener('resize', resize);
        resize();

        async function loadBuiltIn(fileName) {
            menuEl.classList.add('hidden');
            try {
                const response = await fetch(fileName);
                const arrayBuffer = await response.arrayBuffer();
                processAudio(arrayBuffer);
            } catch (err) {
                alert("無法載入歌曲檔案：" + fileName);
                location.reload();
            }
        }

        musicUpload.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            menuEl.classList.add('hidden');
            const arrayBuffer = await file.arrayBuffer();
            processAudio(arrayBuffer);
        });

        async function processAudio(arrayBuffer) {
            isAutoPlay = autoPlayToggle.checked;
            if (isAutoPlay) autoIndicator.classList.remove('hidden');
            
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            generateChart(audioBuffer);
            startCountdown();
        }

        function generateChart(buffer) {
            const data = buffer.getChannelData(0);
            const sampleRate = buffer.sampleRate;
            const config = {
                'Easy': { thresh: 2.2, gap: 0.5, minE: 0.1 },
                'Normal': { thresh: 1.6, gap: 0.3, minE: 0.06 },
                'Hard': { thresh: 1.25, gap: 0.15, minE: 0.04 }
            }[difficulty];

            notes = [];
            const chunkSize = Math.floor(sampleRate * 0.01); // 縮小掃描範圍以提高精度
            let prevEnergy = 0;
            
            for (let i = 0; i < data.length; i += chunkSize) {
                let sum = 0;
                for (let j = 0; j < chunkSize && i + j < data.length; j++) sum += data[i+j] * data[i+j];
                const energy = Math.sqrt(sum / chunkSize);
                
                if (energy > prevEnergy * config.thresh && energy > config.minE) {
                    const time = (i / sampleRate) - 0.02; // 微調解析時間偏移
                    if (notes.length === 0 || time - notes[notes.length - 1].time > config.gap) {
                        notes.push({ lane: Math.floor(Math.random() * 4), time: time, hit: false, missed: false });
                    }
                }
                prevEnergy = energy;
            }
        }

        function startCountdown() {
            isCountingDown = true;
            countdownEl.classList.remove('hidden');
            let count = 3;
            countdownEl.innerText = count;

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownEl.innerText = count;
                } else if (count === 0) {
                    countdownEl.innerText = "GO!";
                } else {
                    clearInterval(timer);
                    countdownEl.classList.add('hidden');
                    isCountingDown = false;
                    startGame();
                }
            }, 1000);
            
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            gameActive = true;
            score = 0; combo = 0; maxCombo = 0; perfectCount = 0;
            updateUI();
            
            const travelTime = getTravelTime();
            // 精確同步計算：startTime 為 AudioContext 現在時間加上 掉落時間 再減去 微調量
            startTime = audioCtx.currentTime + travelTime - SYNC_OFFSET; 

            // 在音符到達底部時播放音樂
            setTimeout(() => {
                if(!gameActive) return;
                audioSource = audioCtx.createBufferSource();
                audioSource.buffer = audioBuffer;
                audioSource.connect(audioCtx.destination);
                audioSource.start();
                
                // 改進的結束判斷：當音源結束，且最後一個音符已經離開螢幕才結算
                audioSource.onended = () => {
                    checkGameEnd();
                };
            }, travelTime * 1000);
        }

        function checkGameEnd() {
            const checkInterval = setInterval(() => {
                const now = audioCtx.currentTime - startTime;
                const lastNote = notes[notes.length - 1];
                // 如果沒有音符，或最後一個音符已經被判定或滑出螢幕
                if (!lastNote || now > lastNote.time + 0.5) {
                    clearInterval(checkInterval);
                    if(gameActive) setTimeout(showResults, 500);
                }
            }, 100);
        }

        function handleInput(lane, isAuto = false) {
            if (!gameActive) return;
            activeLanes[lane] = true;
            setTimeout(() => activeLanes[lane] = false, 100);
            
            const now = audioCtx.currentTime - startTime;
            // 判定範圍優化
            const target = notes.find(n => !n.hit && !n.missed && n.lane === lane && Math.abs(n.time - now) < 0.18);
            
            if (target) {
                const diff = Math.abs(target.time - now) * 1000;
                target.hit = true;
                
                // AutoPlay 擊打視覺反應
                if (isAuto) {
                    perfectCount++; score += 100; combo++;
                    showJudgement("PERFECT", "#fbbf24");
                } else {
                    if (diff <= 70) { 
                        perfectCount++; score += 100; combo++; 
                        showJudgement("PERFECT", "#fbbf24"); 
                    } else if (diff <= 130) { 
                        score += 50; combo++; 
                        showJudgement("GOOD", "#22d3ee"); 
                    } else {
                        target.hit = false; // 判定太差，視為無效
                    }
                }
                if (combo > maxCombo) maxCombo = combo;
                updateUI();
            }
        }

        function showJudgement(t, c) {
            judgmentEl.innerText = t;
            judgmentEl.style.color = c;
            judgmentEl.style.opacity = "1";
            judgmentEl.style.transform = "scale(1.2)";
            setTimeout(() => { 
                if(judgmentEl.innerText === t) {
                    judgmentEl.style.opacity = "0";
                    judgmentEl.style.transform = "scale(1)";
                }
            }, 300);
        }

        function updateUI() {
            scoreEl.innerText = `SCORE: ${score.toString().padStart(6, '0')}`;
            comboEl.innerText = combo > 1 ? `${combo} COMBO` : '';
        }

        function showResults() {
            gameActive = false;
            const fScore = document.getElementById('final-score');
            const fCombo = document.getElementById('max-combo');
            const fPerf = document.getElementById('perfect-count');
            if(fScore) fScore.innerText = score;
            if(fCombo) fCombo.innerText = maxCombo;
            if(fPerf) fPerf.innerText = perfectCount;
            
            if (isAutoPlay) document.getElementById('auto-tag').classList.remove('hidden');
            resultEl.classList.remove('hidden');
        }

        const keyMap = {'d':0, 'f':1, 'j':2, 'k':3};
        window.addEventListener('keydown', e => {
            const lane = keyMap[e.key.toLowerCase()];
            if(lane !== undefined) handleInput(lane);
        });

        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            Array.from(e.changedTouches).forEach(t => {
                const rect = canvas.getBoundingClientRect();
                const x = t.clientX - rect.left;
                handleInput(Math.floor(x / (rect.width / 4)));
            });
        }, {passive: false});

        function gameLoop() {
            if (!gameActive && !isCountingDown) return;
            
            const now = gameActive ? (audioCtx.currentTime - startTime) : -100;
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 背景軌道與判定線
            ctx.fillStyle = 'rgba(255,255,255,0.03)';
            activeLanes.forEach((active, i) => { if(active) ctx.fillRect(i * LANE_WIDTH, 0, LANE_WIDTH, JUDGMENT_LINE_Y); });
            ctx.fillStyle = '#64748b';
            ctx.fillRect(0, JUDGMENT_LINE_Y, CANVAS_WIDTH, 3);

            // 繪製與 AutoPlay 邏輯
            notes.forEach(n => {
                if (n.hit) return;

                // Auto Play：稍微提前擊打以符合視覺
                if (isAutoPlay && now >= n.time && !n.hit && !n.missed) {
                    handleInput(n.lane, true);
                }

                const y = JUDGMENT_LINE_Y - (n.time - now) * noteSpeed * 60;
                
                if (y > -50 && y < CANVAS_HEIGHT + 50) {
                    const colors = ['#f87171','#60a5fa','#a855f7','#fbbf24'];
                    ctx.fillStyle = colors[n.lane];
                    ctx.beginPath();
                    ctx.roundRect(n.lane * LANE_WIDTH + 20, y - 12, LANE_WIDTH - 40, 24, 10);
                    ctx.fill();
                    
                    // 邊框光澤
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }

                // 漏掉判定
                if (now > n.time + 0.15 && !n.hit && !n.missed) {
                    n.missed = true;
                    combo = 0;
                    showJudgement("MISS", "#ef4444");
                    updateUI();
                }
            });
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
