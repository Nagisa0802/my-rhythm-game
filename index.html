<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Chen's Craft</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: white; overflow: hidden; height: 100vh; margin: 0; font-family: sans-serif; touch-action: none; -webkit-user-select: none; }
        canvas { background: #020617; display: block; width: 100%; height: 100%; }
        .diff-active { border-color: #06b6d4 !important; color: #06b6d4 !important; background: rgba(6, 182, 212, 0.2) !important; }
        .countdown-text { animation: zoomInOut 0.8s ease-in-out infinite; }
        @keyframes zoomInOut {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        ::-webkit-scrollbar { display: none; }
        .auto-badge { background: #f43f5e; color: white; padding: 2px 8px; border-radius: 4px; font-size: 10px; margin-left: 8px; vertical-align: middle; }
    </style>
</head>
<body>

    <div id="game-container" class="relative w-full h-full flex items-center justify-center">
        <!-- 頂部資訊 -->
        <div class="absolute top-12 left-6 z-10 pointer-events-none">
            <div id="score-text" class="text-xl font-mono text-cyan-400 uppercase tracking-wider">分數: 000000</div>
            <div id="combo-text" class="text-4xl font-black text-white italic"></div>
            <div id="auto-indicator" class="hidden text-rose-500 font-bold text-sm mt-1 tracking-widest uppercase">自動遊玩中</div>
        </div>

        <!-- 暫停按鈕 -->
        <button id="pause-btn" class="hidden absolute top-12 right-6 z-20 bg-slate-800/80 p-3 rounded-full border border-slate-600 active:scale-90" onclick="togglePause()">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        </button>

        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer" class="absolute inset-0 pointer-events-none flex flex-col items-center justify-center">
            <div id="judgment-text" class="text-5xl font-black italic transition-all duration-75 mb-20"></div>
            <div id="countdown-layer" class="hidden text-8xl font-black italic text-cyan-400 countdown-text"></div>

            <!-- 主選單 -->
            <div id="menu" class="pointer-events-auto bg-slate-900/95 p-8 rounded-[2rem] border border-slate-700 shadow-2xl flex flex-col items-center gap-6 text-center mx-4 max-w-md w-full">
                <div class="space-y-1">
                    <h1 class="text-3xl font-black text-cyan-400 tracking-tighter italic">CHEN'S CRAFT Beta</h1>
                    <p class="text-slate-500 text-[10px] uppercase font-bold tracking-[0.2em]">音樂節奏遊戲</p>
                </div>
                
                <div class="flex items-center gap-3 bg-slate-800/50 px-4 py-2 rounded-full border border-slate-700">
                    <input type="checkbox" id="auto-play-toggle" class="w-5 h-5 accent-rose-500 cursor-pointer">
                    <label for="auto-play-toggle" class="text-slate-300 font-bold text-xs cursor-pointer italic uppercase">開啟自動遊玩</label>
                </div>

                <div class="w-full space-y-2">
                    <p class="text-slate-500 text-[10px] font-black uppercase text-left px-2">選擇遊戲難度</p>
                    <div class="flex gap-2 justify-center">
                        <button id="btn-Easy" onclick="changeDiff('Easy')" class="diff-btn flex-1 py-3 rounded-xl bg-slate-800 border-2 border-transparent font-bold text-sm text-slate-400">簡單</button>
                        <button id="btn-Normal" onclick="changeDiff('Normal')" class="diff-btn flex-1 py-3 rounded-xl bg-slate-800 border-2 border-transparent font-bold diff-active text-sm text-white">一般</button>
                        <button id="btn-Hard" onclick="changeDiff('Hard')" class="diff-btn flex-1 py-3 rounded-xl bg-slate-800 border-2 border-transparent font-bold text-sm text-slate-400">困難</button>
                    </div>
                </div>

                <div class="w-full pt-2">
                    <button id="start-btn" onclick="document.getElementById('music-upload').click()" class="w-full bg-cyan-600 hover:bg-cyan-500 p-5 rounded-2xl font-black text-base transition-all shadow-[0_10px_20px_rgba(8,145,178,0.3)] text-white flex items-center justify-center gap-3 active:scale-95 mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
                        </svg>
                        選取音樂開始遊戲
                    </button>
                    <input type="file" id="music-upload" class="hidden" accept="audio/*">

                    <!-- 下載按鈕 -->
                    <button onclick="downloadGame()" class="w-full py-3 rounded-xl border border-slate-700 text-slate-500 font-bold text-xs hover:text-cyan-400 transition-colors flex items-center justify-center gap-2 uppercase tracking-widest">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                        下載 APP 網頁版 (離線存檔)
                    </button>
                </div>
            </div>

            <!-- 暫停選單 -->
            <div id="pause-menu" class="hidden pointer-events-auto bg-slate-900/98 p-8 rounded-[2rem] border border-slate-600 flex flex-col items-center gap-6 text-center max-w-sm w-full">
                <h2 class="text-3xl font-black text-white italic tracking-tighter uppercase">暫停中</h2>
                <div class="w-full space-y-3">
                    <button onclick="togglePause()" class="w-full bg-cyan-600 text-white py-4 rounded-xl font-bold shadow-lg active:scale-95 uppercase">繼續遊戲</button>
                    <button onclick="location.reload()" class="w-full bg-slate-700 text-slate-300 py-4 rounded-xl font-bold active:scale-95 uppercase">返回主選單</button>
                </div>
            </div>

            <!-- 結算畫面 -->
            <div id="result-screen" class="hidden pointer-events-auto bg-slate-900/98 p-10 rounded-[2rem] border-2 border-cyan-500 flex flex-col items-center gap-4 text-center max-w-sm w-full shadow-[0_0_50px_rgba(6,182,212,0.3)]">
                <h2 class="text-3xl font-bold text-white uppercase tracking-widest">演出成功 <span id="auto-tag" class="hidden auto-badge">自動</span></h2>
                <div class="bg-slate-800/50 p-6 rounded-2xl w-full space-y-2 font-mono text-sm text-left">
                    <div class="flex justify-between border-b border-slate-700 pb-1"><span class="text-slate-400">最終分數</span><span id="final-score" class="text-white font-bold text-lg">0</span></div>
                    <div class="flex justify-between pt-1"><span class="text-slate-400">最高連擊</span><span id="max-combo" class="text-cyan-400 font-bold">0</span></div>
                    <div class="flex justify-between"><span class="text-slate-400">完美打擊</span><span id="perfect-count" class="text-yellow-400 font-bold">0</span></div>
                    <div class="flex justify-between"><span class="text-slate-400">精準度</span><span id="accuracy-text" class="text-rose-400 font-bold">0%</span></div>
                </div>
                <div id="rank-text" class="text-8xl font-black text-cyan-400 drop-shadow-lg italic">S</div>
                <button onclick="location.reload()" class="w-full bg-white text-black py-4 rounded-xl font-bold active:scale-95 transition-transform uppercase tracking-widest">回到主選單</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const musicUpload = document.getElementById('music-upload');
        const menuEl = document.getElementById('menu');
        const pauseMenuEl = document.getElementById('pause-menu');
        const resultEl = document.getElementById('result-screen');
        const pauseBtn = document.getElementById('pause-btn');
        const scoreEl = document.getElementById('score-text');
        const comboEl = document.getElementById('combo-text');
        const judgmentEl = document.getElementById('judgment-text');
        const countdownEl = document.getElementById('countdown-layer');
        const autoPlayToggle = document.getElementById('auto-play-toggle');
        const autoIndicator = document.getElementById('auto-indicator');

        // 延遲補償配置 (秒) - 如果感覺音樂太慢，就調大負值 (如 -0.15)；如果音樂太快，就調小或設為正值。
        const AUDIO_OFFSET = -0.10; 

        let CANVAS_WIDTH, CANVAS_HEIGHT, LANE_WIDTH, JUDGMENT_LINE_Y;
        let difficulty = 'Normal', noteSpeed = 13, gameActive = false, isPaused = false, isCountingDown = false, isAutoPlay = false;
        let score = 0, combo = 0, maxCombo = 0, perfectCount = 0, notes = [], startTime = 0, pauseStartTime = 0, totalPausedTime = 0;
        let audioCtx, audioBuffer, audioSource;
        const activeLanes = [false, false, false, false];
        
        // 為了降低延遲，提前初始化音訊上下文
        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                // 在安卓/iOS上必須由使用者觸發恢復
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }
        }

        function resize() {
            CANVAS_WIDTH = window.innerWidth; CANVAS_HEIGHT = window.innerHeight;
            canvas.width = CANVAS_WIDTH; canvas.height = CANVAS_HEIGHT;
            LANE_WIDTH = CANVAS_WIDTH / 4; JUDGMENT_LINE_Y = CANVAS_HEIGHT * 0.85;
        }
        window.addEventListener('resize', resize); resize();

        function changeDiff(d) {
            difficulty = d;
            document.querySelectorAll('.diff-btn').forEach(b => { b.classList.remove('diff-active', 'text-white'); b.classList.add('text-slate-400'); });
            const activeBtn = document.getElementById('btn-' + d);
            activeBtn.classList.add('diff-active', 'text-white');
            noteSpeed = d === 'Easy' ? 9 : (d === 'Normal' ? 13 : 18);
        }

        musicUpload.addEventListener('change', async (e) => {
            initAudioContext();
            const file = e.target.files[0]; if (!file) return;
            menuEl.classList.add('hidden');
            const arrayBuffer = await file.arrayBuffer();
            audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            isAutoPlay = autoPlayToggle.checked;
            if (isAutoPlay) autoIndicator.classList.remove('hidden');
            generateChart(audioBuffer);
            startCountdown();
        });

        function generateChart(buffer) {
            const data = buffer.getChannelData(0); const sampleRate = buffer.sampleRate;
            const config = { 'Easy': { thresh: 2.2, gap: 0.5, minE: 0.1 }, 'Normal': { thresh: 1.6, gap: 0.3, minE: 0.06 }, 'Hard': { thresh: 1.25, gap: 0.15, minE: 0.04 } }[difficulty];
            notes = []; const chunkSize = Math.floor(sampleRate * 0.01); let prevEnergy = 0;
            for (let i = 0; i < data.length; i += chunkSize) {
                let sum = 0; for (let j = 0; j < chunkSize && i + j < data.length; j++) sum += data[i+j] * data[i+j];
                const energy = Math.sqrt(sum / chunkSize);
                if (energy > prevEnergy * config.thresh && energy > config.minE) {
                    const time = (i / sampleRate);
                    if (notes.length === 0 || time - notes[notes.length - 1].time > config.gap) notes.push({ lane: Math.floor(Math.random() * 4), time: time, hit: false, missed: false });
                }
                prevEnergy = energy;
            }
        }

        function startCountdown() {
            if (isCountingDown) return;
            isCountingDown = true;
            countdownEl.classList.remove('hidden');
            let count = 3;
            countdownEl.innerText = count;
            
            const timer = setInterval(() => {
                if (isPaused) return;
                count--;
                if (count > 0) {
                    countdownEl.innerText = count;
                } else if (count === 0) {
                    countdownEl.innerText = "GO!";
                } else {
                    clearInterval(timer);
                    countdownEl.classList.add('hidden');
                    isCountingDown = false;
                    startGame();
                }
            }, 1000);
            
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            gameActive = true; pauseBtn.classList.remove('hidden');
            score = 0; combo = 0; maxCombo = 0; perfectCount = 0; totalPausedTime = 0; updateUI();
            
            // 下落時間 = 距離 / 速度
            const travelTime = JUDGMENT_LINE_Y / (noteSpeed * 60);
            
            // startTime 決定了音訊播放的同步點。加入 AUDIO_OFFSET 修正延遲
            startTime = audioCtx.currentTime + travelTime + AUDIO_OFFSET; 
            
            // 延遲播放音樂，直到音符剛好到達判定線
            const playDelay = travelTime + AUDIO_OFFSET;
            if (playDelay > 0) {
                setTimeout(() => { if(!gameActive || isPaused) return; playMusicFrom(0); }, playDelay * 1000);
            } else {
                playMusicFrom(Math.abs(playDelay));
            }
        }

        function playMusicFrom(offset) {
            if (audioSource) try { audioSource.stop(); } catch(e) {}
            audioSource = audioCtx.createBufferSource(); 
            audioSource.buffer = audioBuffer;
            audioSource.connect(audioCtx.destination); 
            audioSource.start(0, offset);
            audioSource.onended = () => { if(gameActive && !isPaused) checkGameEnd(); };
        }

        function togglePause() {
            if (!gameActive && !isCountingDown) return;
            if (!isPaused) {
                isPaused = true; pauseStartTime = audioCtx.currentTime;
                if (audioSource) try { audioSource.stop(); } catch(e) {}
                pauseMenuEl.classList.remove('hidden');
            } else {
                isPaused = false; 
                totalPausedTime += (audioCtx.currentTime - pauseStartTime);
                if (gameActive) {
                    const travelTime = JUDGMENT_LINE_Y / (noteSpeed * 60);
                    const currentMusicTime = audioCtx.currentTime - startTime - totalPausedTime + travelTime;
                    if (currentMusicTime > 0) playMusicFrom(currentMusicTime);
                    else setTimeout(() => { if (!isPaused && gameActive) playMusicFrom(0); }, Math.abs(currentMusicTime) * 1000);
                }
                pauseMenuEl.classList.add('hidden');
            }
        }

        function checkGameEnd() {
            const checkInterval = setInterval(() => {
                if (isPaused) return;
                const now = audioCtx.currentTime - startTime - totalPausedTime;
                const lastNote = notes[notes.length - 1];
                if (!lastNote || now > lastNote.time + 1.0) { 
                    clearInterval(checkInterval); 
                    if(gameActive) setTimeout(showResults, 500); 
                }
            }, 100);
        }

        function handleInput(lane, isAuto = false) {
            if (!gameActive || isPaused) return;
            activeLanes[lane] = true; setTimeout(() => activeLanes[lane] = false, 100);
            
            const now = audioCtx.currentTime - startTime - totalPausedTime;
            // 擴大搜尋範圍以提升手感，但判定標準不變
            const target = notes.find(n => !n.hit && !n.missed && n.lane === lane && Math.abs(n.time - now) < 0.20);
            
            if (target) {
                const diff = Math.abs(target.time - now) * 1000; 
                target.hit = true;
                if (isAuto || diff <= 75) { 
                    perfectCount++; score += 100; combo++; showJudgement("PERFECT", "#fbbf24"); 
                } else if (diff <= 150) { 
                    score += 50; combo++; showJudgement("GOOD", "#22d3ee"); 
                } else {
                    target.hit = false; // 沒打準，不計分
                }
                if (combo > maxCombo) maxCombo = combo; updateUI();
            }
        }

        function showJudgement(t, c) {
            judgmentEl.innerText = t; judgmentEl.style.color = c; judgmentEl.style.opacity = "1"; judgmentEl.style.transform = "scale(1.2)";
            setTimeout(() => { if(judgmentEl.innerText === t) { judgmentEl.style.opacity = "0"; judgmentEl.style.transform = "scale(1)"; } }, 300);
        }

        function updateUI() { 
            scoreEl.innerText = `目前分數: ${score.toString().padStart(6, '0')}`; 
            comboEl.innerText = combo > 1 ? `${combo} COMBO` : ''; 
        }

        function showResults() {
            gameActive = false; pauseBtn.classList.add('hidden');
            const maxPossibleScore = notes.length * 100;
            const accuracy = maxPossibleScore > 0 ? (score / maxPossibleScore) * 100 : 0;
            
            document.getElementById('final-score').innerText = score;
            document.getElementById('max-combo').innerText = maxCombo;
            document.getElementById('perfect-count').innerText = perfectCount;
            document.getElementById('accuracy-text').innerText = accuracy.toFixed(1) + "%";
            
            if (isAutoPlay) document.getElementById('auto-tag').classList.remove('hidden');
            
            let rank = 'F';
            if (accuracy >= 95) rank = 'SS';
            else if (accuracy >= 90) rank = 'S';
            else if (accuracy >= 80) rank = 'A';
            else if (accuracy >= 70) rank = 'B';
            else if (accuracy >= 60) rank = 'C';
            else rank = 'D';
            
            document.getElementById('rank-text').innerText = rank;
            resultEl.classList.remove('hidden');
        }

        function downloadGame() {
            const html = document.documentElement.outerHTML;
            const blob = new Blob([html], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'ChensCraft_NoDelay.html';
            a.click();
        }

        // 監聽鍵盤與觸摸
        window.addEventListener('keydown', e => { 
            initAudioContext();
            if (e.key === 'Escape') togglePause(); 
            const l = {'d':0,'f':1,'j':2,'k':3}[e.key.toLowerCase()]; 
            if(l!==undefined) handleInput(l); 
        });

        canvas.addEventListener('touchstart', e => { 
            initAudioContext();
            if (isPaused) return; 
            e.preventDefault(); 
            Array.from(e.changedTouches).forEach(t => handleInput(Math.floor((t.clientX - canvas.getBoundingClientRect().left) / (canvas.width / 4)))); 
        }, {passive: false});

        function gameLoop() {
            if (!gameActive && !isCountingDown) return;
            if (isPaused) { requestAnimationFrame(gameLoop); return; }
            
            const now = gameActive ? (audioCtx.currentTime - startTime - totalPausedTime) : -100;
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            // 繪製軌道發光
            activeLanes.forEach((active, i) => { if(active) { ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fillRect(i * LANE_WIDTH, 0, LANE_WIDTH, JUDGMENT_LINE_Y); } });
            
            // 繪製判定線
            ctx.fillStyle = '#64748b'; ctx.fillRect(0, JUDGMENT_LINE_Y, CANVAS_WIDTH, 3);
            
            // 繪製音符
            notes.forEach(n => {
                if (n.hit) return;
                
                // 自動模式邏輯
                if (isAutoPlay && now >= n.time && !n.hit && !n.missed) handleInput(n.lane, true);
                
                const y = JUDGMENT_LINE_Y - (n.time - now) * noteSpeed * 60;
                
                // 只渲染可見區域內的音符
                if (y > -50 && y < CANVAS_HEIGHT + 50) {
                    ctx.fillStyle = ['#f87171','#60a5fa','#a855f7','#fbbf24'][n.lane];
                    ctx.beginPath(); 
                    ctx.roundRect(n.lane * LANE_WIDTH + 20, y - 12, LANE_WIDTH - 40, 24, 10); 
                    ctx.fill();
                    ctx.strokeStyle = 'white'; ctx.lineWidth = 1; ctx.stroke();
                }
                
                // 錯失判定 (逾時)
                if (now > n.time + 0.18 && !n.hit && !n.missed) { 
                    n.missed = true; 
                    combo = 0; 
                    showJudgement("MISS", "#ef4444"); 
                    updateUI(); 
                }
            });
            
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
