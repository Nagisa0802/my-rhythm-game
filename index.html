<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Beat Master Pro</title>
    <!-- 引入 PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #020617;
            color: white;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', system-ui, sans-serif;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        canvas {
            background: linear-gradient(to bottom, #020617, #0f172a);
            display: block;
        }
        .judgment-anim {
            animation: pop 0.1s ease-out;
        }
        @keyframes pop {
            0% { transform: scale(1.3); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
        #music-upload { display: none; }
        .btn-glow:active { transform: scale(0.95); box-shadow: 0 0 20px rgba(6, 182, 212, 0.5); }
    </style>
</head>
<body>

    <div id="game-container" class="relative w-full h-full flex flex-col items-center justify-center bg-black">
        <!-- 頂部資訊列 -->
        <div class="absolute top-12 left-6 z-10 pointer-events-none">
            <div id="score-text" class="text-xl font-mono text-cyan-400 drop-shadow-md">SCORE: 000000</div>
            <div id="combo-text" class="text-4xl font-black text-white italic drop-shadow-xl"></div>
        </div>

        <canvas id="gameCanvas"></canvas>
        
        <!-- UI 控制層 -->
        <div id="ui-layer" class="absolute inset-0 pointer-events-none flex flex-col items-center justify-center">
            <div id="judgment-text" class="text-5xl font-black italic drop-shadow-lg"></div>
            
            <!-- 主選單 -->
            <div id="menu" class="pointer-events-auto bg-slate-900/95 p-8 rounded-[2rem] border border-slate-700 shadow-2xl flex flex-col items-center gap-6 text-center mx-4 max-w-sm">
                <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-500 tracking-tighter">BEAT MASTER PRO</h1>
                
                <div class="w-full space-y-3">
                    <p class="text-slate-400 text-xs mb-2">選擇遊戲難度</p>
                    <div class="flex gap-2 justify-center">
                        <button onclick="setDifficulty('Easy')" id="btn-Easy" class="diff-btn px-4 py-2 rounded-lg bg-slate-800 text-sm font-bold border-2 border-transparent">簡單</button>
                        <button onclick="setDifficulty('Normal')" id="btn-Normal" class="diff-btn px-4 py-2 rounded-lg bg-slate-800 text-sm font-bold border-2 border-cyan-500 text-cyan-400">一般</button>
                        <button onclick="setDifficulty('Hard')" id="btn-Hard" class="diff-btn px-4 py-2 rounded-lg bg-slate-800 text-sm font-bold border-2 border-transparent">困難</button>
                    </div>
                </div>

                <label for="music-upload" class="btn-glow w-full bg-cyan-600 hover:bg-cyan-500 px-8 py-4 rounded-2xl cursor-pointer transition-all font-bold shadow-lg shadow-cyan-900/40 text-lg">
                    選擇音樂並開始
                </label>
                <input type="file" id="music-upload" accept="audio/*">
                
                <p class="text-slate-500 text-[10px]">支援 MP3, WAV | 40ms 判定校準</p>
            </div>

            <!-- 分析中 -->
            <div id="loading" class="hidden flex flex-col items-center gap-6">
                <div class="relative w-20 h-20">
                    <div class="absolute inset-0 border-4 border-cyan-500/20 rounded-full"></div>
                    <div class="absolute inset-0 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin"></div>
                </div>
                <div class="text-xl text-cyan-400 font-bold tracking-widest animate-pulse">精確分析頻譜節拍中...</div>
            </div>

            <!-- 結算畫面 -->
            <div id="result-screen" class="hidden pointer-events-auto bg-slate-950/98 p-10 rounded-[2.5rem] border-2 border-cyan-500 shadow-2xl flex flex-col items-center gap-4 text-center mx-4 min-w-[320px]">
                <h2 class="text-4xl font-black text-white italic mb-2">STAGE CLEAR</h2>
                <div class="w-full space-y-2 mb-4 bg-slate-900/50 p-6 rounded-2xl">
                    <div class="flex justify-between items-center text-slate-400 text-sm"><span>總得分</span><span id="final-score" class="text-2xl text-white font-mono font-bold">0</span></div>
                    <div class="flex justify-between items-center text-slate-400 text-sm"><span>最高連擊</span><span id="max-combo" class="text-xl text-cyan-400 font-mono">0</span></div>
                    <div class="flex justify-between items-center text-slate-400 text-sm"><span>Perfect</span><span id="perfect-count" class="text-green-400 font-mono">0</span></div>
                    <div class="flex justify-between items-center text-slate-400 text-sm"><span>Good</span><span id="good-count" class="text-blue-400 font-mono">0</span></div>
                </div>
                <div id="rank-text" class="text-8xl font-black text-transparent bg-clip-text bg-gradient-to-b from-yellow-300 to-orange-500 mb-2">S</div>
                <button onclick="location.reload()" class="w-full bg-white text-black py-4 rounded-2xl font-black text-lg hover:bg-cyan-400 transition-colors active:scale-95">
                    再次挑戰
                </button>
            </div>
        </div>
    </div>

    <script>
        // PWA Service Worker 註冊
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed'));
            });
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const musicUpload = document.getElementById('music-upload');
        const menuEl = document.getElementById('menu');
        const loadingEl = document.getElementById('loading');
        const resultEl = document.getElementById('result-screen');
        const scoreEl = document.getElementById('score-text');
        const comboEl = document.getElementById('combo-text');
        const judgmentEl = document.getElementById('judgment-text');

        let LANE_COUNT = 4, LANE_WIDTH, CANVAS_WIDTH, CANVAS_HEIGHT, JUDGMENT_LINE_Y;
        const JUDGMENT_LINE_Y_RATIO = 0.85;
        let NOTE_SPEED = 8;
        const COLORS = ['#ef4444', '#3b82f6', '#a855f7', '#f59e0b'];
        const KEYS = ['d', 'f', 'j', 'k'];

        let audioCtx, audioSource, audioBuffer;
        let score = 0, combo = 0, maxCombo = 0, perfectCount = 0, goodCount = 0;
        let notes = [];
        let gameActive = false;
        let startTime = 0;
        let difficulty = 'Normal';
        const activeLanes = new Array(4).fill(false);

        function setDifficulty(d) {
            difficulty = d;
            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.classList.remove('border-cyan-500', 'text-cyan-400');
                btn.classList.add('border-transparent');
            });
            document.getElementById('btn-' + d).classList.add('border-cyan-500', 'text-cyan-400');
            document.getElementById('btn-' + d).classList.remove('border-transparent');
            
            // 根據難度調整速度
            if(d === 'Easy') NOTE_SPEED = 6;
            else if(d === 'Normal') NOTE_SPEED = 8;
            else if(d === 'Hard') NOTE_SPEED = 11;
        }

        function resize() {
            CANVAS_WIDTH = window.innerWidth;
            CANVAS_HEIGHT = window.innerHeight;
            canvas.width = CANVAS_WIDTH;
            canvas.height = CANVAS_HEIGHT;
            LANE_WIDTH = CANVAS_WIDTH / LANE_COUNT;
            JUDGMENT_LINE_Y = CANVAS_HEIGHT * JUDGMENT_LINE_Y_RATIO;
        }
        window.addEventListener('resize', resize);
        resize();

        musicUpload.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            menuEl.classList.add('hidden');
            loadingEl.classList.remove('hidden');

            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const arrayBuffer = await file.arrayBuffer();
            audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

            analyzeEnhancedBeats(audioBuffer);
            loadingEl.classList.add('hidden');
            startGame();
        });

        // 增強版頻譜分析：捕捉大鼓、小鼓、與旋律
        function analyzeEnhancedBeats(buffer) {
            const data = buffer.getChannelData(0);
            const sampleRate = buffer.sampleRate;
            const chunkSize = Math.floor(sampleRate * 0.02); // 提高取樣精度 (20ms)
            notes = [];

            // 難度參數矩陣
            const config = {
                'Easy': { thresh: 1.6, minGap: 0.35, fluxWeight: 0.5 },
                'Normal': { thresh: 1.4, minGap: 0.22, fluxWeight: 1.0 },
                'Hard': { thresh: 1.25, minGap: 0.12, fluxWeight: 1.5 }
            }[difficulty];

            let prevEnergy = 0;
            const energyHistory = [];

            for (let i = 0; i < data.length; i += chunkSize) {
                let sum = 0;
                for (let j = 0; j < chunkSize && i + j < data.length; j++) {
                    sum += data[i + j] * data[i + j];
                }
                const energy = Math.sqrt(sum / chunkSize);
                
                // Spectral Flux 簡化版：捕捉瞬間能量變化
                const flux = Math.max(0, energy - prevEnergy);
                const avgEnergy = energyHistory.length > 0 ? energyHistory.reduce((a, b) => a + b) / energyHistory.length : 0;
                
                if (flux > avgEnergy * config.thresh && energy > 0.03) {
                    const time = i / sampleRate;
                    if (notes.length === 0 || time - notes[notes.length - 1].time > config.minGap) {
                        notes.push({
                            lane: Math.floor(Math.random() * LANE_COUNT),
                            time: time,
                            hit: false,
                            missed: false
                        });
                    }
                }

                energyHistory.push(energy);
                if (energyHistory.length > 15) energyHistory.shift();
                prevEnergy = energy;
            }
        }

        function startGame() {
            score = 0; combo = 0; maxCombo = 0; perfectCount = 0; goodCount = 0;
            gameActive = true;
            updateScoreUI();
            
            audioSource = audioCtx.createBufferSource();
            audioSource.buffer = audioBuffer;
            audioSource.connect(audioCtx.destination);
            audioSource.start();
            startTime = audioCtx.currentTime;
            audioSource.onended = () => setTimeout(showResults, 1200);
            requestAnimationFrame(gameLoop);
        }

        function handleInput(index) {
            if (!gameActive) return;
            activeLanes[index] = true;
            setTimeout(() => activeLanes[index] = false, 80);

            const currentTime = audioCtx.currentTime - startTime;
            
            // 尋找最近的音符
            const targetNote = notes.find(n => 
                !n.hit && !n.missed && n.lane === index && 
                Math.abs(n.time - currentTime) < 0.2
            );

            if (targetNote) {
                const diff = Math.abs(targetNote.time - currentTime) * 1000; // 轉毫秒
                
                // 依照要求設定精確判定
                if (diff <= 80) { // 這裡 0-80ms 都算 Perfect (40-80區間在內)
                    targetNote.hit = true;
                    perfectCount++;
                    processHit('PERFECT', 'text-yellow-400', 100);
                } else if (diff <= 120) { // 80-120ms Good
                    targetNote.hit = true;
                    goodCount++;
                    processHit('GOOD', 'text-cyan-400', 50);
                }
            }
        }

        function processHit(rating, color, pts) {
            score += pts;
            combo++;
            if (combo > maxCombo) maxCombo = combo;
            updateScoreUI();
            showJudgment(rating, color);
        }

        function updateScoreUI() {
            scoreEl.innerText = `SCORE: ${score.toString().padStart(6, '0')}`;
            comboEl.innerText = combo > 1 ? `${combo} COMBO` : '';
        }

        function showJudgment(text, color) {
            judgmentEl.innerText = text;
            judgmentEl.className = `text-5xl font-black italic judgment-anim ${color}`;
        }

        function showResults() {
            gameActive = false;
            document.getElementById('final-score').innerText = score;
            document.getElementById('max-combo').innerText = maxCombo;
            document.getElementById('perfect-count').innerText = perfectCount;
            document.getElementById('good-count').innerText = goodCount;
            
            const totalNotes = notes.length;
            const accuracy = (perfectCount + goodCount * 0.5) / totalNotes;
            let rank = 'C';
            if (accuracy > 0.9) rank = 'S';
            else if (accuracy > 0.8) rank = 'A';
            else if (accuracy > 0.6) rank = 'B';
            
            document.getElementById('rank-text').innerText = rank;
            resultEl.classList.remove('hidden');
        }

        // 輸入控制
        window.addEventListener('keydown', e => {
            const idx = KEYS.indexOf(e.key.toLowerCase());
            if (idx !== -1) handleInput(idx);
        });

        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            Array.from(e.changedTouches).forEach(t => {
                const x = t.clientX - canvas.getBoundingClientRect().left;
                handleInput(Math.floor(x / LANE_WIDTH));
            });
        }, {passive: false});

        function gameLoop() {
            if (!gameActive) return;
            const currentTime = audioCtx.currentTime - startTime;
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 軌道光效
            for(let i=0; i<4; i++) {
                if(activeLanes[i]) {
                    const g = ctx.createLinearGradient(0, JUDGMENT_LINE_Y, 0, 0);
                    g.addColorStop(0, 'rgba(255,255,255,0.15)');
                    g.addColorStop(1, 'transparent');
                    ctx.fillStyle = g;
                    ctx.fillRect(i * LANE_WIDTH, 0, LANE_WIDTH, JUDGMENT_LINE_Y);
                }
            }

            // 判定線
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(0, JUDGMENT_LINE_Y); ctx.lineTo(CANVAS_WIDTH, JUDGMENT_LINE_Y); ctx.stroke();
            
            // 繪製音符
            notes.forEach(n => {
                if (n.hit) return;
                const y = JUDGMENT_LINE_Y - (n.time - currentTime) * NOTE_SPEED * 60;

                if (y > -50 && y < CANVAS_HEIGHT + 50) {
                    ctx.fillStyle = COLORS[n.lane];
                    ctx.beginPath();
                    ctx.roundRect(n.lane * LANE_WIDTH + 10, y, LANE_WIDTH - 20, 24, 6);
                    ctx.fill();
                    
                    // 音符發光
                    ctx.shadowBlur = 10; ctx.shadowColor = COLORS[n.lane];
                    ctx.stroke(); ctx.shadowBlur = 0;
                }

                if (!n.missed && !n.hit && currentTime > n.time + 0.15) {
                    n.missed = true; combo = 0;
                    showJudgment('MISS', 'text-red-600');
                    updateScoreUI();
                }
            });

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
