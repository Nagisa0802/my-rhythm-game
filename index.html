<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chen's Craft - Rating System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: white; overflow: hidden; height: 100vh; margin: 0; font-family: sans-serif; touch-action: none; -webkit-user-select: none; }
        canvas { background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); display: block; width: 100%; height: 100%; position: fixed; top: 0; left: 0; z-index: 0; }
        
        /* 隱藏滾動條但保留功能 */
        #ui-layer::-webkit-scrollbar { display: none; }
        #ui-layer { -ms-overflow-style: none; scrollbar-width: none; }

        .tap-active { animation: tap-flash 0.1s ease-out; }
        @keyframes tap-flash {
            0% { background-color: rgba(34, 211, 238, 0.5); }
            100% { background-color: transparent; }
        }
    </style>
</head>
<body>

    <div id="game-container" class="relative w-full h-full flex items-start justify-center overflow-hidden">
        <!-- 頂部即時數據 (固定在最上層) -->
        <div class="fixed top-12 left-6 z-20 pointer-events-none flex flex-col gap-1">
            <div id="score-text" class="text-xl font-mono text-cyan-400 tracking-tighter">SCORE: 000000</div>
            <div id="acc-text" class="text-sm font-mono text-slate-400">ACC: 100.00%</div>
            <div id="combo-text" class="text-5xl font-black text-white italic drop-shadow-lg mt-2"></div>
        </div>

        <canvas id="gameCanvas"></canvas>
        
        <!-- UI 容器：改為可垂直捲動，防止內容被下方遮擋 -->
        <div id="ui-layer" class="relative z-10 w-full h-full overflow-y-auto pointer-events-none flex flex-col items-center justify-start pt-20 pb-32">
            
            <!-- 判定文字 -->
            <div id="judgment-text" class="text-6xl font-black italic mb-10 min-h-[80px] transition-opacity duration-200 opacity-0"></div>
            
            <!-- 倒數 -->
            <div id="countdown-display" class="hidden flex flex-col items-center mt-10">
                <div id="countdown-number" class="text-9xl font-black italic text-cyan-400">3</div>
            </div>

            <!-- 主選單 (增加 pointer-events-auto 確保可點擊與捲動觸發) -->
            <div id="menu" class="pointer-events-auto bg-slate-900/95 p-8 rounded-[2.5rem] border border-slate-700 shadow-2xl flex flex-col items-center gap-6 text-center mx-4 max-w-md w-full backdrop-blur-md mb-10">
                <div class="space-y-1">
                    <h1 class="text-4xl font-black text-cyan-400 tracking-tighter italic uppercase">Chen's Craft</h1>
                    <p class="text-slate-500 text-xs font-bold tracking-[0.2em]">現版本為 V3.1(made by chen)</p>
                </div>

                <div class="w-full bg-slate-800/50 p-5 rounded-2xl border border-slate-700 space-y-4">
                    <div class="flex justify-between items-center px-1">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">延遲補償 (Offset)</span>
                        <span id="offset-display" class="text-cyan-400 font-mono font-bold text-xl">0ms</span>
                    </div>
                    <button id="cal-start-btn" class="w-full bg-cyan-900/40 border border-cyan-500/50 py-3 rounded-xl text-cyan-400 font-bold text-xs uppercase tracking-widest active:scale-95 transition-all">
                        開始校準 (點擊 8 次)
                    </button>
                    <input type="range" id="offset-slider" min="-500" max="500" value="0" class="w-full accent-cyan-500 cursor-pointer h-2 bg-slate-700 rounded-lg appearance-none">
                </div>
                
                <div class="flex gap-4 w-full">
                    <div class="flex-1 flex items-center justify-center gap-2 bg-slate-800/50 py-4 rounded-xl border border-slate-700">
                        <input type="checkbox" id="auto-play-toggle" class="w-5 h-5 accent-rose-500">
                        <label for="auto-play-toggle" class="text-slate-300 font-bold text-xs uppercase cursor-pointer">Auto Play</label>
                    </div>
                    <select id="diff-select" class="flex-1 bg-slate-800 text-white font-bold text-xs rounded-xl border border-slate-700 px-4 outline-none appearance-none text-center">
                        <option value="Easy">簡單模式</option>
                        <option value="Normal" selected>一般模式</option>
                        <option value="Hard">困難模式</option>
                    </select>
                </div>

                <button id="play-btn" class="w-full bg-cyan-600 hover:bg-cyan-500 p-5 rounded-2xl font-black text-white shadow-xl active:scale-95 transition-all text-lg tracking-widest uppercase">
                    選取音檔(mp3)
                </button>
                <input type="file" id="music-upload" class="hidden" accept="audio/*">
            </div>

            <!-- 校準覆蓋層 -->
            <div id="cal-overlay" class="hidden fixed inset-0 z-[100] bg-black/95 flex flex-col items-center justify-center p-8 pointer-events-auto">
                <div class="text-cyan-400 text-xs font-black uppercase tracking-[0.3em] mb-4">校準中</div>
                <h2 class="text-2xl font-bold mb-2">請對準「嗶」聲點擊</h2>
                <div class="w-full max-w-xs aspect-square border-4 border-dashed border-slate-700 rounded-full flex flex-col items-center justify-center my-8 bg-slate-900/30">
                    <p id="cal-count" class="text-8xl font-black text-white">0 / 8</p>
                    <p id="cal-last-diff" class="text-cyan-500 font-mono text-sm mt-2">Ready...</p>
                </div>
                <div class="w-64 h-2 bg-slate-800 rounded-full overflow-hidden">
                    <div id="cal-progress" class="h-full bg-cyan-500 transition-all duration-200" style="width: 0%"></div>
                </div>
            </div>

            <!-- 結算畫面 -->
            <div id="result-screen" class="hidden pointer-events-auto bg-slate-900/98 p-10 rounded-[3rem] border-2 border-cyan-500 flex flex-col items-center gap-4 text-center max-w-sm w-full backdrop-blur-xl mb-10">
                <h2 class="text-xl font-bold text-slate-400 uppercase tracking-widest">Performance Result</h2>
                <div id="rank-text" class="text-9xl font-black text-cyan-400 italic leading-none my-4">S</div>
                <div id="final-acc" class="text-2xl font-black text-white">Accuracy: 0.00%</div>
                
                <div class="grid grid-cols-3 gap-4 w-full mt-2 mb-4 bg-slate-800/50 p-4 rounded-2xl border border-slate-700">
                    <div class="flex flex-col">
                        <span class="text-[10px] text-cyan-400 font-bold uppercase">Perfect</span>
                        <span id="stat-perfect" class="text-lg font-mono">0</span>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-[10px] text-yellow-400 font-bold uppercase">Good</span>
                        <span id="stat-good" class="text-lg font-mono">0</span>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-[10px] text-rose-500 font-bold uppercase">Miss</span>
                        <span id="stat-miss" class="text-lg font-mono">0</span>
                    </div>
                </div>

                <div id="final-score" class="text-lg font-mono text-slate-500">SCORE: 000000</div>
                
                <button onclick="location.reload()" class="w-full bg-cyan-600 text-white py-4 rounded-xl font-black mt-4 hover:bg-cyan-500 active:scale-95 transition-all">RETRY / HOME</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const musicUpload = document.getElementById('music-upload');
        const offsetSlider = document.getElementById('offset-slider');
        const offsetDisplay = document.getElementById('offset-display');
        const calOverlay = document.getElementById('cal-overlay');
        const calCountDisplay = document.getElementById('cal-count');
        const calProgress = document.getElementById('cal-progress');
        const calLastDiffDisplay = document.getElementById('cal-last-diff');
        
        let audioCtx, audioBuffer, audioSource;
        let audioOffset = parseInt(localStorage.getItem('game_offset') || 0);
        let gameActive = false, score = 0, combo = 0, startTime = 0, notes = [];
        let isCalibrating = false, calHistory = [], calCount = 0;
        let isCountingDown = false, lastToneTime = 0;
        
        let stats = { perfect: 0, good: 0, miss: 0 };

        offsetSlider.value = audioOffset;
        offsetDisplay.innerText = audioOffset + 'ms';
        
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        offsetSlider.oninput = () => {
            audioOffset = parseInt(offsetSlider.value);
            offsetDisplay.innerText = audioOffset + 'ms';
            localStorage.setItem('game_offset', audioOffset);
        };

        document.getElementById('cal-start-btn').onclick = (e) => {
            e.stopPropagation(); initAudio();
            isCalibrating = true; calCount = 0; calHistory = [];
            calOverlay.classList.remove('hidden');
            calCountDisplay.innerText = "0 / 8";
            calProgress.style.width = "0%";
            scheduleTone(audioCtx.currentTime + 1.0);
        };

        function scheduleTone(time) {
            if (!isCalibrating || calCount >= 8) return;
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.connect(g); g.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(880, time);
            g.gain.setValueAtTime(0, time);
            g.gain.linearRampToValueAtTime(0.4, time + 0.01);
            g.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
            osc.start(time); osc.stop(time + 0.15);
            lastToneTime = time; 
            setTimeout(() => scheduleTone(time + 1.0), 1000);
        }

        function triggerCalClick(e) {
            if (!isCalibrating || calCount >= 8) return;
            if (e) e.preventDefault();
            const clickTime = audioCtx.currentTime;
            let diff = clickTime - lastToneTime;
            while (diff > 0.5) diff -= 1.0;
            while (diff < -0.5) diff += 1.0;
            calHistory.push(diff);
            calCount++;
            calLastDiffDisplay.innerText = `${Math.round(diff * 1000)}ms`;
            calCountDisplay.innerText = `${calCount} / 8`;
            calProgress.style.width = `${(calCount/8)*100}%`;
            if (calCount === 8) {
                const avgDiff = calHistory.reduce((a, b) => a + b, 0) / 8;
                audioOffset = Math.round(avgDiff * -1000);
                offsetSlider.value = audioOffset;
                offsetDisplay.innerText = audioOffset + 'ms';
                localStorage.setItem('game_offset', audioOffset);
                isCalibrating = false;
                setTimeout(() => calOverlay.classList.add('hidden'), 500);
            }
        }
        calOverlay.addEventListener('mousedown', triggerCalClick);
        calOverlay.addEventListener('touchstart', triggerCalClick);

        async function generateChart() {
            const data = audioBuffer.getChannelData(0);
            const sampleRate = audioBuffer.sampleRate;
            const diff = document.getElementById('diff-select').value;
            const cfg = { 'Easy': { threshold: 1.8, gap: 0.45 }, 'Normal': { threshold: 1.5, gap: 0.35 }, 'Hard': { threshold: 1.2, gap: 0.22 } }[diff];
            
            notes = [];
            const step = Math.floor(sampleRate / 100);
            let prevEnergy = 0;
            
            for (let i = 0; i < data.length; i += step) {
                let sum = 0;
                for (let j = 0; j < step && i + j < data.length; j++) sum += data[i + j] * data[i + j];
                const energy = Math.sqrt(sum / step);
                if (energy > prevEnergy * cfg.threshold && energy > 0.05) {
                    const time = i / sampleRate;
                    if (notes.length === 0 || time - notes[notes.length - 1].time > cfg.gap) {
                        notes.push({ lane: Math.floor(Math.random() * 4), time: parseFloat(time.toFixed(3)), hit: false, missed: false });
                    }
                }
                prevEnergy = energy;
            }
        }

        let CANVAS_WIDTH, CANVAS_HEIGHT, LANE_WIDTH, JUDGMENT_LINE_Y;
        function resize() {
            CANVAS_WIDTH = window.innerWidth; CANVAS_HEIGHT = window.innerHeight;
            canvas.width = CANVAS_WIDTH; canvas.height = CANVAS_HEIGHT;
            LANE_WIDTH = CANVAS_WIDTH / 4; JUDGMENT_LINE_Y = CANVAS_HEIGHT * 0.85;
        }
        window.addEventListener('resize', resize); resize();

        document.getElementById('play-btn').onclick = () => { initAudio(); musicUpload.click(); };

        musicUpload.onchange = async (e) => {
            const file = e.target.files[0]; if (!file) return;
            document.getElementById('menu').classList.add('hidden');
            const ab = await file.arrayBuffer();
            audioBuffer = await audioCtx.decodeAudioData(ab);
            await generateChart();
            startCountdown();
        };

        function startCountdown() {
            isCountingDown = true;
            const display = document.getElementById('countdown-display');
            const num = document.getElementById('countdown-number');
            display.classList.remove('hidden');
            let count = 3; num.innerText = count;
            const timer = setInterval(() => {
                count--;
                if (count > 0) num.innerText = count;
                else if (count === 0) num.innerText = "GO!";
                else {
                    clearInterval(timer);
                    display.classList.add('hidden');
                    isCountingDown = false;
                    startGame();
                }
            }, 1000);
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            gameActive = true; score = 0; combo = 0;
            stats = { perfect: 0, good: 0, miss: 0 };
            const speed = { 'Easy': 9, 'Normal': 13, 'Hard': 18 }[document.getElementById('diff-select').value];
            const travelTime = JUDGMENT_LINE_Y / (speed * 60);
            startTime = audioCtx.currentTime + travelTime + (audioOffset / 1000);
            
            const delay = travelTime + (audioOffset / 1000);
            if (delay > 0) setTimeout(() => playMusic(0), delay * 1000);
            else playMusic(Math.abs(delay));
        }

        function playMusic(offset) {
            if (audioSource) try { audioSource.stop(); } catch(e) {}
            audioSource = audioCtx.createBufferSource();
            audioSource.buffer = audioBuffer;
            audioSource.connect(audioCtx.destination);
            audioSource.start(0, offset);
        }

        function handleInput(lane) {
            if (!gameActive) return;
            const now = audioCtx.currentTime - startTime;
            const target = notes.find(n => !n.hit && !n.missed && n.lane === lane && Math.abs(n.time - now) < 0.16);
            if (target) {
                target.hit = true;
                const diff = Math.abs(target.time - now);
                if (diff < 0.065) {
                    stats.perfect++;
                    combo++;
                    score += 100;
                    showJudge("PERFECT");
                } else {
                    stats.good++;
                    combo++;
                    score += 60;
                    showJudge("GOOD");
                }
                updateAcc();
            }
        }

        function updateAcc() {
            const totalReached = stats.perfect + stats.good + stats.miss;
            if (totalReached === 0) return;
            const currentAcc = ((stats.perfect + stats.good * 0.6) / totalReached) * 100;
            document.getElementById('acc-text').innerText = `ACC: ${currentAcc.toFixed(2)}%`;
        }

        function showJudge(txt) {
            const el = document.getElementById('judgment-text');
            el.innerText = txt; el.style.opacity = 1;
            el.style.color = txt === "PERFECT" ? "#22d3ee" : (txt === "GOOD" ? "#fbbf24" : "#ef4444");
            setTimeout(() => { if(el.innerText === txt) el.style.opacity = 0; }, 300);
        }

        canvas.addEventListener('touchstart', e => {
            e.preventDefault(); initAudio();
            Array.from(e.changedTouches).forEach(t => {
                handleInput(Math.floor(t.clientX / (canvas.width/4)));
            });
        }, {passive: false});

        function calculateRank(acc) {
            if (acc >= 100) return "SSS";
            if (acc >= 95) return "SS";
            if (acc >= 90) return "S";
            if (acc >= 80) return "A";
            if (acc >= 70) return "B";
            if (acc >= 60) return "C";
            return "D";
        }

        function gameLoop() {
            if (!gameActive && !isCountingDown) return;
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            for(let i=1; i<4; i++) {
                ctx.beginPath(); ctx.moveTo(i*LANE_WIDTH, 0); ctx.lineTo(i*LANE_WIDTH, CANVAS_HEIGHT); ctx.stroke();
            }
            ctx.fillStyle = 'rgba(34, 211, 238, 0.4)';
            ctx.fillRect(0, JUDGMENT_LINE_Y-2, CANVAS_WIDTH, 4);

            if (gameActive) {
                const now = audioCtx.currentTime - startTime;
                const speed = { 'Easy': 9, 'Normal': 13, 'Hard': 18 }[document.getElementById('diff-select').value] * 60;
                const isAuto = document.getElementById('auto-play-toggle').checked;

                notes.forEach(n => {
                    if (n.hit) return;
                    if (isAuto && now >= n.time) handleInput(n.lane);

                    const y = JUDGMENT_LINE_Y - (n.time - now) * speed;
                    if (y > -100 && y < CANVAS_HEIGHT + 100) {
                        ctx.fillStyle = ['#f87171', '#60a5fa', '#c084fc', '#fbbf24'][n.lane];
                        ctx.beginPath(); ctx.roundRect(n.lane*LANE_WIDTH+10, y-12, LANE_WIDTH-20, 24, 12); ctx.fill();
                        ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.stroke();
                    }
                    if (now > n.time + 0.16 && !n.hit && !n.missed) { 
                        n.missed = true; stats.miss++; combo = 0; showJudge("MISS"); updateAcc();
                    }
                });

                document.getElementById('score-text').innerText = `SCORE: ${score.toString().padStart(6, '0')}`;
                document.getElementById('combo-text').innerText = combo > 1 ? `${combo} COMBO` : '';
                
                if (notes.length > 0 && now > notes[notes.length-1].time + 2) {
                    gameActive = false;
                    const finalAccValue = ((stats.perfect + stats.good * 0.6) / (stats.perfect + stats.good + stats.miss)) * 100;
                    
                    document.getElementById('rank-text').innerText = calculateRank(finalAccValue);
                    document.getElementById('final-acc').innerText = `Accuracy: ${finalAccValue.toFixed(2)}%`;
                    document.getElementById('stat-perfect').innerText = stats.perfect;
                    document.getElementById('stat-good').innerText = stats.good;
                    document.getElementById('stat-miss').innerText = stats.miss;
                    document.getElementById('final-score').innerText = `SCORE: ${score.toString().padStart(6, '0')}`;
                    
                    document.getElementById('result-screen').classList.remove('hidden');
                    // 當結果出現時，自動滾動到最下方以確保按鈕可見
                    document.getElementById('ui-layer').scrollTo({top: 1000, behavior: 'smooth'});
                }
            }
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
